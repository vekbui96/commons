name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify
        run: npm run verify
      - name: Build with Pages base path
        run: npm run build
        env:
          # Served from https://vekbui96.github.io/commons/ (also the build default).
          VITE_BASE: /commons/
          # Commons API base URL (docs/api-contract.md). Unset until the API is
          # deployed: set the repo variable COMMONS_API then.
          VITE_COMMONS_API: ${{ vars.COMMONS_API || '' }}
          # Pages is always the public build: private apps are cut from the bundle.
          COMMONS_TARGET: public
          # Public NFC tags (#/t/<id>?k=): the gateway base and the static backup
          # copy (repo variables, docs/nfc-controls-contract.md). Unset = no route.
          VITE_NFC_GATEWAY: ${{ vars.NFC_GATEWAY || '' }}
          VITE_NFC_FALLBACK: ${{ vars.NFC_FALLBACK || '' }}
      - name: Check no private app reached the public build
        run: node scripts/check-dist.mjs public
        env:
          # The one tailnet-named origin allowed in the public bundle (exact match).
          VITE_NFC_GATEWAY: ${{ vars.NFC_GATEWAY || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy (Pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
