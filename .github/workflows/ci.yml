name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format Â· Typecheck Â· Lint Â· Test Â· Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify (format, typecheck, lint, test)
        run: npm run verify
      - name: Build (private target) and check it has the private apps
        run: npm run build && node scripts/check-dist.mjs private
        env:
          COMMONS_TARGET: private
      - name: Build (public target)
        run: npm run build
      - name: Check no private app reached the public build
        run: node scripts/check-dist.mjs public
